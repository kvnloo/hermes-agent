# Red/green check for add-on commits, before anything is posted upstream.
# Comment on the fork's "Red/green requests" issue:
#   /rg <commit-sha> [base=<sha>] [tests=<path>[,<path>...]]
# GREEN runs the tests at <commit>. RED keeps those test files but reverts every
# other file changed between <base> (default: the commit's parent) and <commit>.
# Verdict DISCRIMINATES only when RED fails and GREEN passes. The workflow
# replies on the same issue with the verdict and the run link.
name: Red/green verify
on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: rg-${{ github.event.comment.id }}
jobs:
  run:
    if: startsWith(github.event.comment.body, '/rg ') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      report: ${{ steps.rg.outputs.report }}
    steps:
      - name: Parse request
        id: req
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          line=$(printf '%s\n' "$BODY" | head -1)
          sha=$(printf '%s' "$line" | awk '{print $2}')
          base=$(printf '%s' "$line" | grep -o 'base=[0-9a-fA-F]*' | cut -d= -f2 || true)
          tests=$(printf '%s' "$line" | grep -o 'tests=[^ ]*' | cut -d= -f2 | tr ',' ' ' || true)
          [[ "$sha" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "bad sha: $sha"; exit 1; }
          { echo "sha=$sha"; echo "base=$base"; echo "tests=$tests"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the commit
        id: co
        env:
          SHA: ${{ steps.req.outputs.sha }}
          BASE: ${{ steps.req.outputs.base }}
          TESTS: ${{ steps.req.outputs.tests }}
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q upstream "$SHA" || git fetch -q origin "$SHA"
          git checkout -q --detach "$SHA"
          base=${BASE:-$(git rev-parse HEAD~1)}
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q upstream "$base"
          changed=$(git diff --name-only "$base" HEAD)
          tests=${TESTS:-$(printf '%s\n' $changed | grep -E '(^|/)tests/.*test_[^/]*\.py$' || true)}
          src=$(printf '%s\n' $changed | grep -E '\.py$' | grep -vE '(^|/)tests/' || true)
          { echo "base=$base"; echo "head=$(git rev-parse HEAD)"; echo "tests=$(echo $tests)"; echo "src=$(echo $src)"; } >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv sync -q --frozen --group dev --group test --extra messaging \
            || uv sync -q --frozen --extra dev --extra messaging --extra anthropic --extra acp \
            || uv sync -q --frozen --extra dev || uv sync -q --frozen
          uv run python -c 'import pytest' 2>/dev/null || uv pip install -q pytest pytest-asyncio pytest-timeout
      - name: Red and green
        id: rg
        env:
          BASE: ${{ steps.co.outputs.base }}
          HEAD_SHA: ${{ steps.co.outputs.head }}
          TESTS: ${{ steps.co.outputs.tests }}
          SRC: ${{ steps.co.outputs.src }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          sum() { grep -E '^(=+ )?[0-9]+ (passed|failed|error)|no tests ran|^(ERROR|FAILED) ' "$1" | tail -3 | tr '\n' ' '; }
          if [ -z "$TESTS" ]; then verdict=ERROR; why="no test files changed; pass tests=<path>"; else
            uv run python -m pytest -q -p no:cacheprovider $TESTS > green.log 2>&1; g=$?
            for f in $SRC; do if git cat-file -e "$BASE:$f" 2>/dev/null; then git show "$BASE:$f" > "$f"; else rm -f "$f"; fi; done
            uv run python -m pytest -q -p no:cacheprovider $TESTS > red.log 2>&1; r=$?
            git checkout -q -- . 2>/dev/null
            if [ -z "$SRC" ]; then verdict=ERROR; why="no source changes between base and commit, so RED equals GREEN; pass base=<PR base sha> for a test-only commit"
            elif [ $g = 0 ] && [ $r != 0 ]; then verdict=DISCRIMINATES; why="fails without the change, passes with it"
            elif [ $g = 0 ]; then verdict=DOES-NOT-DISCRIMINATE; why="passes with the change reverted too: not a regression test for it"
            else verdict=GREEN-FAILS; why="fails with the change applied"; fi
          fi
          { echo "### Red/green: **$verdict**"; echo; echo "$why"; echo
            echo "| | tree | result |"; echo "|---|---|---|"
            echo "| RED | \`${HEAD_SHA:0:10}\` with $(echo $SRC | wc -w) source file(s) from \`${BASE:0:10}\` | $(sum red.log 2>/dev/null) exit ${r:-n/a} |"
            echo "| GREEN | \`${HEAD_SHA:0:10}\` | $(sum green.log 2>/dev/null) exit ${g:-n/a} |"
            echo; echo "Tests: \`$TESTS\`"; echo; echo "Source reverted for RED: \`${SRC:-none}\`"; echo; echo "Run: $RUN_URL"; } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'report<<RGEOF'; cat report.md; echo RGEOF; } >> "$GITHUB_OUTPUT"
          for f in green red; do [ -f $f.log ] && { echo "== $f"; tail -40 $f.log; }; done
  reply:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.run.outputs.report }}
          RESULT: ${{ needs.run.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$REPORT" ] || REPORT=$(printf '### Red/green: **ERROR**\n\nThe run ended %s before a verdict. Run: %s' "$RESULT" "$RUN_URL")
          printf 'Re %s\n\n%s\n' "${{ github.event.comment.html_url }}" "$REPORT" > body.md
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -F body=@body.md
