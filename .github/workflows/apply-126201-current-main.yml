name: Apply current-main compression fallback port

on:
  push:
    branches:
      - fix/126201-current-main-authoritative-route

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/126201-current-main-authoritative-route
          fetch-depth: 0
      - name: Apply and verify port
        shell: bash
        run: |
          echo '' | base64 -d | python
          python -m py_compile agent/auxiliary_client.py agent/context_compressor.py tests/agent/test_compression_aux_fallback_authority.py
          python -m pytest -q tests/agent/test_compression_aux_fallback_authority.py tests/agent/test_compression_aux_fallback_route.py
          rm -f .github/workflows/apply-126201-current-main.yml
      - name: Commit port
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/auxiliary_client.py agent/context_compressor.py tests/agent/test_compression_aux_fallback_authority.py .github/workflows/apply-126201-current-main.yml
          git commit -m "fix(compression): make main fallback route authoritative"
          git push origin HEAD:fix/126201-current-main-authoritative-route
