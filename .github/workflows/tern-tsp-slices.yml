name: Tern TSP slices

on:
  pull_request:
    branches:
      - feat/tern-tsp-surface
    paths:
      - ui-tui/src/tern/**
      - ui-tui/packages/hermes-ink/**
      - .github/workflows/tern-tsp-slices.yml
  push:
    branches:
      - feat/tern-tsp-*
      - exp/tern-ux-*

jobs:
  tern-unit:
    name: TSP unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the TUI workspace
        run: npm ci --workspace ui-tui --include-workspace-root --ignore-scripts
      - name: Build Ink
        run: npm run build:ink --workspace ui-tui
      - name: Run TSP tests
        run: npm test --workspace ui-tui -- src/tern
      - name: Emit UX experiment manifest
        run: npm run tern:ux:manifest --workspace ui-tui
      - name: Typecheck native fixture viewer
        run: npm run tern:ux:check --workspace ui-tui
      - name: Verify offline fixture dump
        run: |
          npm run --silent tern:ux:preview --workspace ui-tui -- --dump > "$RUNNER_TEMP/native-a-views.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/native-a-views.json")); assert len(d["views"]) == 14; assert d["variant"] == "omp-baseline"; print("14 semantic views; no visual verification claimed")'
      - name: Exercise real Node PTYs with fake Tern replies
        run: python3 ui-tui/scripts/tern-ux/smoke_preview.py
