name: code-health semantic rule readiness

on:
  push:
    branches:
      - exp/code-health-rule-readiness-96bb97a

permissions:
  actions: read
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned Ruff
        run: python -m pip install "$(python -m scripts.code_health --print-pins)"

      - name: Freeze validated 300-PR corpus
        run: |
          sample=experiments/code_health_rule_readiness_sample.json
          if [ ! -f "$sample" ]; then
            gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/11321505998/zip > /tmp/readiness.zip
            python - <<'PY'
          import json, zipfile
          from pathlib import Path

          with zipfile.ZipFile("/tmp/readiness.zip") as zf:
              rows = json.loads(zf.read("replay.json"))
          sample = [
              {
                  "number": row["number"],
                  "title": row["title"],
                  "mergedAt": row.get("mergedAt", ""),
                  "base": row["base"],
                  "head": row["head"],
              }
              for row in rows
              if row.get("base") and row.get("head")
          ]
          assert len(sample) == 300, len(sample)
          Path("experiments/code_health_rule_readiness_sample.json").write_text(
              json.dumps(sample, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$sample"
            git commit -m "test: freeze 300-PR semantic readiness corpus"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fetch upstream main history
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags --depth=6000 upstream main

      - name: Replay fixed corpus
        run: |
          PYTHONPATH=. python experiments/code_health_rule_readiness.py \
            --limit 300 \
            --sample-file experiments/code_health_rule_readiness_sample.json \
            --examples-per-rule 12 \
            --out rule-readiness

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-health-rule-readiness
          path: rule-readiness/
          retention-days: 14
