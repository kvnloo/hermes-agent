#
# docker-compose.macos.yml — macOS / Windows Docker Desktop override
#
# Docker Desktop (macOS and Windows) runs containers inside a Linux VM, so
# `network_mode: host` maps to the VM's network namespace — NOT the Mac/PC
# host. Ports bound inside the VM are invisible to the host browser, and
# `ports:` mappings are silently ignored while host networking is active.
# The fix is the compose default bridge network plus explicitly published
# ports (the same shape as docker-compose.windows.yml).
#
# The dashboard service shares the gateway container's network namespace
# (`network_mode: "service:gateway"`) so the gateway-liveness PID probe and
# bridge port publication reaches the gateway's container address, while
# only the GATEWAY container's ports are published on host loopback.
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) \
#     docker compose -f docker-compose.yml -f docker-compose.macos.yml up -d
#
# Configure a dashboard auth provider first (basic auth or OAuth), then
# open http://localhost:9119 in the Mac browser. Without one, the dashboard
# refuses the non-loopback bind rather than serving without authentication.

services:
  gateway:
    network_mode: bridge
    ports:
      # Host loopback publish; forwarding targets the container's bridge
      # address, so the dashboard itself must use an authenticated bind.
      - "127.0.0.1:9119:9119"
      # To also expose the OpenAI-compatible API server to the Mac, also
      # uncomment API_SERVER_HOST/API_SERVER_KEY in the base file and add:
      # - "127.0.0.1:8642:8642"

  dashboard:
    # Preserve BOTH network and PID namespaces. Network sharing alone does
    # not make the gateway process visible to the dashboard's liveness probe.
    network_mode: "service:gateway"
    pid: "service:gateway"
    # Docker port publishing forwards to the container interface, not to
    # 127.0.0.1 inside it. A non-loopback bind is therefore required, and
    # Hermes' auth gate refuses it unless an auth provider is configured.
    # Never bypass the gate with --insecure.
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
    # Port publication is owned by gateway in this shared namespace.
