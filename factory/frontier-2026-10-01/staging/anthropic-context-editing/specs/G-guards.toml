owner_decisions = []

[base]
repo = "NousResearch/hermes-agent"
pin = "44a1ce9724502b9c692faaef00af3054bf11f1a6"

[[arms]]
id = "base"
tree = "@base"

[[arms]]
id = "head"
branch = "staging/anthropic-context-editing"
head = "05d6dbc172d24db4b237f8ef130fb4dc2e8651df"
parent = "@base"

[probe]
kind = "script"
driver = "harness/f14_guards.py --worktree <worktree> --arm {arm} --raw raw --private <private>"
probes = ["token_accounting/replay_gates", "token_accounting/ab_image_cost_calibration", "token_accounting/worktree_prompt_prefix", "native_compaction/ab_checkpoint_preflight", "provider_fallback/probe_104120", "provider_fallback/probe_104260", "provider_fallback/probe_104360", "goal_command_parity", "compaction/test_region_scoping", "postmortem/run_non_live (9 probes)", "postmortem/context_cap_probe", "postmortem/deadline_probe", "postmortem/goal_scope_probe", "postmortem/finalizer_schedule_probe"]
not_run = ["postmortem/goal_repaste_probe: needs RF_STATE_COPY, a copy of a real session state.db, which this run may not touch", "readtool fixtures via direct read_file only: F14 names no command"]
reps = 1
order = "base then head"
timeout_s = 900

[oracle]
type = "equal"
decision_rule = "EQUAL iff every run probe has the same verdict (exit code + documented marker; replay_gates: its verdict map; postmortem runner: its per-probe PASS/FAIL table) on base and head, and replay_gates is 11/11 PASS on head. Normalised-output hashes are reported per probe; a hash difference with equal verdicts is explained in the receipt. A probe that fails on base too is recorded as pre-existing, not as a regression. Because 2 F14 items are not run, P5 can be at most PARTIAL."

guards = []
invalidate_on = ["agent/turn_recovery.py", "agent/native_compaction.py", "agent/context_compressor.py", "agent/anthropic_adapter.py", "agent/chat_completion_helpers.py"]

[outputs]
public = ["per-probe verdicts", "key result fields (normalised)", "normalised-output hashes"]
private = ["full probe stdout/stderr and output files (local paths), kept outside the artifact tree"]
not_tested = ["the Anthropic payload (covered by F09)", "postmortem/goal_repaste_probe", "readtool fixtures"]

[budget]
usd = 0
wall_s = 1800
cpu_core_s = 3600
max_cells = 28
lease_hours = 24
