hypothesis = "identical verdict maps: the slice is default-off and only touches the anthropic_messages request path, the generalised recovery table and config plumbing"
varied = "tree"
fixed = ["F14 scripts at base blobs: replay_gates 66fa6a42d4, ab_image_cost_calibration 36750cbf3a, worktree_prompt_prefix 8826e39e70, ab_checkpoint_preflight d698994e54, probe_104120 7b97d52637, probe_104260 c31e4e431e, probe_104360 26338d8115, goal_command_parity f8b5bc55ac, compaction/test_region_scoping a6c29c32ba, postmortem tree e148fbe877 (run.py 5d078e3ab0, context_cap 144adc65ac, deadline 630795b7ac, goal_scope e0f127b11f, finalizer_schedule 596309560f), tests/e2e/test_relay_native_openai_stream.py 7c0aef79c5 (the slice changes none of them)", "venv interpreter", "env -i with a fresh throwaway HOME/HERMES_HOME per probe"]
